<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size:22px; font-weight:bold; fill:#0B2545; }
      .panel-title { font-size:14px; font-weight:bold; fill:#0B2545; }
      .lbl { font-size:11px; fill:#1f2a3d; }
      .ann { font-size:12px; fill:#0B2545; font-weight:bold; }
      .num { font-size:13px; font-weight:bold; fill:#FFFFFF; }
      .legend-name { font-size:13px; fill:#0B2545; }
      .legend-desc { font-size:11px; fill:#5a6b7d; }
      .cost { font-size:12px; font-weight:bold; fill:#E8871E; }
      .lead { stroke:#8aa0b5; stroke-width:1.2; fill:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="#FFFFFF"/>

  <!-- ======= TITLE ======= -->
  <text x="20" y="34" class="title">AFRICA RESQ — ROVER SKETCH (low-cost, ROS2-ready)</text>
  <text x="20" y="52" class="lbl">Teleoperated + semi-autonomous exploration rover · LiDAR-SLAM · fire/smoke/survivor sensing · climbs rubble &amp; steps</text>

  <!-- ============ SIDE VIEW ============ -->
  <rect x="20" y="64" width="600" height="452" fill="#F5F8FC" stroke="#0B2545" stroke-width="1.5" rx="6"/>
  <text x="40" y="88" class="panel-title">SIDE VIEW</text>

  <!-- track belt outer -->
  <path d="M135 322 L475 322 A38 38 0 0 1 513 360 A38 38 0 0 1 475 398 L135 398 A38 38 0 0 1 97 360 A38 38 0 0 1 135 322 Z" fill="#26313C" stroke="#0B2545" stroke-width="2.5"/>
  <!-- track belt inner -->
  <path d="M135 336 L475 336 A24 24 0 0 1 499 360 A24 24 0 0 1 475 384 L135 384 A24 24 0 0 1 111 360 A24 24 0 0 1 135 336 Z" fill="#161c24"/>
  <!-- road wheels -->
  <circle cx="200" cy="360" r="23" fill="#39424D" stroke="#0B2545" stroke-width="2"/>
  <circle cx="272" cy="360" r="23" fill="#39424D" stroke="#0B2545" stroke-width="2"/>
  <circle cx="342" cy="360" r="23" fill="#39424D" stroke="#0B2545" stroke-width="2"/>
  <circle cx="414" cy="360" r="23" fill="#39424D" stroke="#0B2545" stroke-width="2"/>
  <!-- drive sprocket / idler -->
  <circle cx="135" cy="360" r="36" fill="#E8871E" stroke="#0B2545" stroke-width="2.5"/>
  <circle cx="475" cy="360" r="36" fill="#39424D" stroke="#0B2545" stroke-width="2.5"/>
  <circle cx="135" cy="360" r="12" fill="#0B2545"/>
  <circle cx="475" cy="360" r="12" fill="#0B2545"/>

  <!-- chassis -->
  <rect x="160" y="190" width="310" height="120" rx="12" fill="#0B2545"/>
  <rect x="160" y="190" width="310" height="16" rx="8" fill="#16335C"/>

  <!-- front flipper (climbing aid) -->
  <path d="M95 368 L152 354 L157 372 L103 384 Z" fill="#E8871E" stroke="#0B2545" stroke-width="1.5"/>
  <circle cx="128" cy="370" r="7" fill="#0B2545"/>

  <!-- gearmotors hint -->
  <rect x="258" y="300" width="18" height="18" fill="#E8871E"/>
  <rect x="330" y="300" width="18" height="18" fill="#E8871E"/>

  <!-- LiDAR mast + head -->
  <line x1="315" y1="190" x2="315" y2="110" stroke="#0B2545" stroke-width="3"/>
  <rect x="280" y="80" width="70" height="30" rx="5" fill="#0B2545"/>
  <rect x="280" y="80" width="70" height="8" rx="4" fill="#E8871E"/>
