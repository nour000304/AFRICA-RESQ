  <path d="M268 96 A48 48 0 0 1 362 96" stroke="#E8871E" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <circle cx="272" cy="82" r="2" fill="#E8871E"/>
  <circle cx="358" cy="82" r="2" fill="#E8871E"/>

