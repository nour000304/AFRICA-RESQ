  <polyline points="445,150 428,118 428,110" fill="none" stroke="#0B2545" stroke-width="2"/>
  <circle cx="428" cy="108" r="3" fill="#E8871E"/>

  <!-- sensor pack -->
  <rect x="178" y="222" width="48" height="30" rx="4" fill="#E8871E"/>
  <line x1="186" y1="252" x2="186" y2="284" stroke="#0B2545" stroke-width="1.5"/>
  <line x1="202" y1="252" x2="202" y2="284" stroke="#0B2545" stroke-width="1.5"/>
  <line x1="218" y1="252" x2="218" y2="284" stroke="#0B2545" stroke-width="1.5"/>
  <circle cx="186" cy="286" r="4" fill="#E8871E"/>
  <circle cx="202" cy="286" r="4" fill="#E8871E"/>
  <circle cx="218" cy="286" r="4" fill="#E8871E"/>

  <!-- motor driver -->
  <rect x="246" y="190" width="54" height="28" rx="3" fill="#2E5A8A"/>
  <!-- IMU -->
  <rect x="268" y="226" width="32" height="26" rx="3" fill="#E8871E"/>
  <!-- RPi -->
  <rect x="348" y="198" width="52" height="38" rx="4" fill="#2E5A8A"/>
  <text x="358" y="221" class="lbl" fill="#FFFFFF">RPi4</text>
  <!-- battery -->
  <rect x="416" y="216" width="44" height="34" rx="4" fill="#2E5A8A"/>
  <text x="424" y="236" class="lbl" fill="#FFFFFF">LiPo</text>

  <!-- leader lines + numbers (side) -->
  <g class="lead"><line x1="315" y1="78" x2="315" y2="64"/></g>
  <g class="lead"><line x1="205" y1="120" x2="205" y2="100"/></g>
  <g class="lead"><line x1="445" y1="106" x2="447" y2="88"/></g>
  <g class="lead"><line x1="202" y1="220" x2="196" y2="204"/></g>
  <g class="lead"><line x1="374" y1="196" x2="378" y2="180"/></g>
  <g class="lead"><line x1="273" y1="188" x2="270" y2="172"/></g>
  <g class="lead"><line x1="438" y1="214" x2="444" y2="198"/></g>
  <g class="lead"><line x1="284" y1="224" x2="288" y2="210"/></g>
  <g class="lead"><line x1="160" y1="360" x2="128" y2="330"/></g>
  <g class="lead"><line x1="513" y1="396" x2="548" y2="380"/></g>
  <g class="lead"><line x1="315" y1="175" x2="308" y2="158"/></g>
  <g class="lead"><line x1="128" y1="372" x2="96" y2="338"/></g>

  <circle cx="315" cy="60"  r="11" fill="#0B2545"/><text x="315" y="65" text-anchor="middle" class="num">1</text>
  <circle cx="205" cy="96"  r="11" fill="#0B2545"/><text x="205" y="101" text-anchor="middle" class="num">2</text>
  <circle cx="447" cy="84"  r="11" fill="#0B2545"/><text x="447" y="89" text-anchor="middle" class="num">3</text>
  <circle cx="194" cy="200" r="11" fill="#0B2545"/><text x="194" y="205" text-anchor="middle" class="num">4</text>
  <circle cx="380" cy="176" r="11" fill="#0B2545"/><text x="380" y="181" text-anchor="middle" class="num">5</text>
  <circle cx="268" cy="168" r="11" fill="#0B2545"/><text x="268" y="173" text-anchor="middle" class="num">6</text>
  <circle cx="446" cy="194" r="11" fill="#0B2545"/><text x="446" y="199" text-anchor="middle" class="num">7</text>
  <circle cx="290" cy="206" r="11" fill="#0B2545"/><text x="290" y="211" text-anchor="middle" class="num">8</text>
  <circle cx="124" cy="326" r="11" fill="#0B2545"/><text x="124" y="331" text-anchor="middle" class="num">9</text>
  <circle cx="552" cy="376" r="11" fill="#0B2545"/><text x="552" y="381" text-anchor="middle" class="num">10</text>
  <circle cx="306" cy="154" r="11" fill="#0B2545"/><text x="306" y="159" text-anchor="middle" class="num">11</text>
  <circle cx="92"  cy="334" r="11" fill="#0B2545"/><text x="92"  y="339" text-anchor="middle" class="num">12</text>

  <!-- ============ TOP VIEW ============ -->
  <rect x="640" y="64" width="340" height="452" fill="#F5F8FC" stroke="#0B2545" stroke-width="1.5" rx="6"/>
  <text x="660" y="88" class="panel-title">TOP VIEW</text>

  <rect x="654" y="150" width="12" height="240" rx="3" fill="#26313C"/> <!-- left track strip -->
  <rect x="958" y="150" width="12" height="240" rx="3" fill="#26313C"/> <!-- right track strip -->
  <rect x="666" y="150" width="292" height="240" rx="10" fill="#0B2545"/>

  <!-- LiDAR center -->
  <circle cx="812" cy="268" r="26" fill="#E8871E" stroke="#0B2545" stroke-width="1.5"/>
  <circle cx="812" cy="268" r="9" fill="#0B2545"/>
  <circle cx="812" cy="268" r="52" fill="none" stroke="#E8871E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M812 216 L822 226 L802 226 Z" fill="#E8871E"/>
  <path d="M812 268 L808 244" stroke="#0B2545" stroke-width="1.5"/>

  <!-- camera front (top = front) -->
  <rect x="700" y="166" width="46" height="24" rx="4" fill="#16335C"/>
  <ellipse cx="723" cy="216" rx="7" ry="6" fill="#E8871E"/>

  <!-- sensor pack -->
  <rect x="700" y="202" width="46" height="22" rx="4" fill="#E8871E"/>

  <!-- GPS -->
  <rect x="902" y="162" width="40" height="24" rx="4" fill="#16335C"/>
  <polyline points="922,162 932,140 938,140" fill="none" stroke="#0B2545" stroke-width="1.5"/>

  <!-- battery -->
  <rect x="700" y="244" width="50" height="34" rx="4" fill="#2E5A8A"/>
  <text x="706" y="265" class="lbl" fill="#FFFFFF">LiPo</text>

  <!-- motor driver -->
  <rect x="760" y="320" width="44" height="26" rx="3" fill="#2E5A8A"/>
  <!-- IMU -->
  <rect x="762" y="244" width="34" height="24" rx="3" fill="#E8871E"/>
  <!-- RPi -->
  <rect x="838" y="316" width="56" height="34" rx="4" fill="#2E5A8A"/>
  <text x="846" y="336" class="lbl" fill="#FFFFFF">RPi4</text>

  <!-- top-view numbers -->
  <g class="lead"><line x1="812" y1="214" x2="812" y2="196"/></g>
  <g class="lead"><line x1="723" y1="212" x2="723" y2="194"/></g>
  <g class="lead"><line x1="922" y1="160" x2="930" y2="142"/></g>
  <g class="lead"><line x1="860" y1="198" x2="880" y2="182"/></g>
  <g class="lead"><line x1="866" y1="314" x2="880" y2="296"/></g>
  <g class="lead"><line x1="782" y1="318" x2="792" y2="300"/></g>
  <g class="lead"><line x1="725" y1="242" x2="732" y2="224"/></g>
  <g class="lead"><line x1="779" y1="242" x2="788" y2="224"/></g>
  <g class="lead"><line x1="772" y1="368" x2="774" y2="386"/></g>
  <g class="lead"><line x1="746" y1="368" x2="722" y2="386"/></g>

  <circle cx="812" cy="192" r="11" fill="#0B2545"/><text x="812" y="197" text-anchor="middle" class="num">1</text>
  <circle cx="723" cy="190" r="11" fill="#0B2545"/><text x="723" y="195" text-anchor="middle" class="num">2</text>
  <circle cx="933" cy="138" r="11" fill="#0B2545"/><text x="933" y="143" text-anchor="middle" class="num">3</text>
  <circle cx="884" cy="178" r="11" fill="#0B2545"/><text x="884" y="183" text-anchor="middle" class="num">4</text>
  <circle cx="884" cy="292" r="11" fill="#0B2545"/><text x="884" y="297" text-anchor="middle" class="num">5</text>
  <circle cx="796" cy="296" r="11" fill="#0B2545"/><text x="796" y="301" text-anchor="middle" class="num">6</text>
  <circle cx="734" cy="220" r="11" fill="#0B2545"/><text x="734" y="225" text-anchor="middle" class="num">7</text>
  <circle cx="790" cy="220" r="11" fill="#0B2545"/><text x="790" y="225" text-anchor="middle" class="num">8</text>
  <circle cx="774" cy="390" r="11" fill="#0B2545"/><text x="774" y="395" text-anchor="middle" class="num">9</text>
  <circle cx="722" cy="390" r="11" fill="#0B2545"/><text x="722" y="395" text-anchor="middle" class="num">10</text>

  <!-- ============ LEGEND ============ -->
  <rect x="20" y="530" width="960" height="236" fill="#FFFFFF" stroke="#0B2545" stroke-width="1.5" rx="6"/>
  <text x="40" y="555" class="panel-title">COMPONENTS &amp; EST. COST (TARGET ≈ $220 · LiDAR: YDLIDAR X2L ~$60 · driver: ydlidar_ros2)</text>

  <!-- left column items 1-6 -->
  <g transform="translate(40,578)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">1</text>
    <text x="30" y="5" class="legend-name">LiDAR — YDLIDAR X2L 360°, 8 m (cheap 360° ROS2)</text>
    <text x="30" y="20" class="legend-desc">SLAM + obstacle map / localisation (ROS2: /scan)</text>
    <text x="300" y="12" class="cost">≈ $60</text>
  </g>
  <g transform="translate(40,606)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">2</text>
    <text x="30" y="5" class="legend-name">Camera — RPi Camera V2.1</text>
    <text x="30" y="20" class="legend-desc">YOLO fire / smoke / survivor detection (ROS2: /image_raw)</text>
    <text x="300" y="12" class="cost">≈ $18</text>
  </g>
  <g transform="translate(40,634)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">3</text>
    <text x="30" y="5" class="legend-name">GPS — NEO-6M + antenna</text>
    <text x="30" y="20" class="legend-desc">outdoor position (ROS2: /fix)</text>
    <text x="300" y="12" class="cost">≈ $6</text>
  </g>
  <g transform="translate(40,662)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">4</text>
    <text x="30" y="5" class="legend-name">Env. sensors — DHT22 + MQ-2 + MQ-7</text>
    <text x="30" y="20" class="legend-desc">temp, humidity, gas, CO/smoke (feeds risk score)</text>
    <text x="300" y="12" class="cost">≈ $8</text>
  </g>
  <g transform="translate(40,690)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">5</text>
    <text x="30" y="5" class="legend-name">Computer — Raspberry Pi 4B 2 GB + 16 GB SD</text>
    <text x="30" y="20" class="legend-desc">runs ROS2 Humble + edge YOLO + AFRICA RESQ API</text>
    <text x="300" y="12" class="cost">≈ $45</text>
  </g>
  <g transform="translate(40,718)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">6</text>
    <text x="30" y="5" class="legend-name">Drive — 4× 12V high-torque gearmotors + L298N ×2</text>
    <text x="30" y="20" class="legend-desc">differential drive, torque for climbing (ROS2: /cmd_vel)</text>
    <text x="300" y="12" class="cost">≈ $30</text>
  </g>

  <!-- right column items 7-12 -->
  <g transform="translate(520,578)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">7</text>
    <text x="30" y="5" class="legend-name">IMU — MPU-6050 (6-axis)</text>
    <text x="30" y="20" class="legend-desc">roll / pitch / heading for climbing stability</text>
    <text x="300" y="12" class="cost">≈ $3</text>
  </g>
  <g transform="translate(520,606)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">8</text>
    <text x="30" y="5" class="legend-name">Power — 11.1 V LiPo + buck/BEC</text>
    <text x="30" y="20" class="legend-desc">balanced low for low centre of gravity</text>
    <text x="300" y="12" class="cost">≈ $16</text>
  </g>
  <g transform="translate(520,634)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">9</text>
    <text x="30" y="5" class="legend-name">Gearmotors (see #6)</text>
    <text x="30" y="20" class="legend-desc">hub + encoder option for /odom</text>
    <text x="300" y="12" class="cost">—</text>
  </g>
  <g transform="translate(520,662)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">10</text>
    <text x="30" y="5" class="legend-name">Rubber tracks + sprockets</text>
    <text x="30" y="20" class="legend-desc">climbs rubble, kerbs &amp; steps; 4 road wheels each side</text>
    <text x="300" y="12" class="cost">≈ $20</text>
  </g>
  <g transform="translate(520,690)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">11</text>
    <text x="30" y="5" class="legend-name">Chassis — aluminium + 3D-printed mounts</text>
    <text x="30" y="20" class="legend-desc">tub design, low COG, front flipper for obstacles</text>
    <text x="300" y="12" class="cost">≈ $10</text>
  </g>
  <g transform="translate(520,718)">
    <circle cx="10" cy="10" r="10" fill="#0B2545"/><text x="10" y="15" text-anchor="middle" class="num" font-size="11">12</text>
    <text x="30" y="5" class="legend-name">Wiring, connectors, fasteners, brackets</text>
    <text x="30" y="20" class="legend-desc">misc. hardware</text>
    <text x="300" y="12" class="cost">≈ $4</text>
  </g>

  <text x="20" y="770" class="lbl">Sketch for the AFRICA RESQ rover · dimensions indicative (~L50 × W34 × H30 cm) · convertible to tracks-off 4WD to save weight/cost</text>
</svg>