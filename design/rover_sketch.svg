  <line x1="205" y1="190" x2="205" y2="152" stroke="#0B2545" stroke-width="3"/>
  <rect x="172" y="122" width="66" height="30" rx="4" fill="#16335C"/>
  <ellipse cx="238" cy="137" rx="8" ry="7" fill="#E8871E"/>

