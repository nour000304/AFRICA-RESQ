name: Build & Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy the current main from the Actions tab without a new commit.
  workflow_dispatch:

# A second push while a deploy is running cancels the older one, so two
# deploys can never race each other onto the VPS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/abdelkbirna/africa-resq

jobs:
  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR with GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false

  deploy:
    name: Deploy to VPS
    needs: build # only runs if the build job succeeded
    runs-on: ubuntu-latest
    # Best-effort fast path only. Hostinger's edge drops GitHub-runner (Azure)
    # traffic, so this SSH times out through no fault of the build. Watchtower
    # on the VPS does the deploy that counts -- it polls GHCR every 2 minutes
    # and recreates the container.
    continue-on-error: true

    steps:
      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/clients/africa-resq
            docker compose pull
            docker compose up -d
            docker image prune -f
